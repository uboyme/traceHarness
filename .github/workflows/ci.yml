name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev,tui]"
      - run: python -m compileall -q src
      - run: pytest
      - name: Test Python Quality plugin distribution
        run: python -m pytest -q
        working-directory: examples/plugins/traceh-python-quality-plugin
      - name: Test Plugin Creator Skill distribution
        run: python -m pytest -q
        working-directory: examples/plugins/traceh-plugin-creator-skill-plugin
      - run: traceh doctor --data-dir /tmp/traceh-ci

  # Windows remains an explicit matrix because SQLite/Git subprocess, terminal,
  # path-length and Textual lifecycle behavior must run on the supported OS.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,tui]"
      - run: python -m compileall -q src
      - run: pytest
      - name: Test Python Quality plugin distribution
        run: python -m pytest -q
        working-directory: examples/plugins/traceh-python-quality-plugin
      - name: Test Plugin Creator Skill distribution
        run: python -m pytest -q
        working-directory: examples/plugins/traceh-plugin-creator-skill-plugin
      - run: traceh doctor --data-dir ${{ runner.temp }}/traceh-ci
