[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceh-python-quality-plugin"
version = "0.2.2"
description = "TraceHarness Python project inspection, environment policy, and named test verifier."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "TraceHarness contributors" }]
dependencies = [
  "traceharness-py>=0.5,<0.9",
]

[project.entry-points."traceh.plugins"]
"traceh.python.quality" = "traceh_python_quality_plugin:PythonQualityPlugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
