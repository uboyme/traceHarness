[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceharness-py"
# Read from traceh.version.__version__ so the wheel metadata and the imported
# package can never disagree. See [tool.setuptools.dynamic] below.
dynamic = ["version"]
description = "An event-sourced, reconstructable Python runtime for traceable coding agents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "TraceHarness contributors" }]
keywords = ["agent", "llm", "runtime", "event-sourcing", "coding-agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
]
# v0.4 introduces the project's first runtime dependency. PEP 440 version and
# requirement parsing drives manifest compatibility, plugin dependency ranges
# and entry-point distribution checks; a hand-rolled parser here would be an
# incomplete PEP 440 implementation guarding a trust boundary.
dependencies = [
  "packaging>=24.0,<27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[project.scripts]
traceh = "traceh.cli.main:main"

[tool.setuptools.dynamic]
version = { attr = "traceh.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
traceh = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: builds wheels and a clean virtual environment; deselect with -m 'not slow'",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]
