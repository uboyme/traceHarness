[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceh-plugin-creator-skill-plugin"
version = "0.1.0"
description = "A source-only TraceHarness plugin-authoring skill for candidate workspaces."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "TraceHarness contributors" }]
dependencies = [
  "traceharness-py>=0.5,<0.6",
]

[project.entry-points."traceh.plugins"]
"traceh.plugin.creator" = "traceh_plugin_creator_skill:PluginCreatorSkillPlugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
traceh_plugin_creator_skill = ["SKILL.md", "references/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
